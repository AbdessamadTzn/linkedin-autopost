name: Obtenir LINKEDIN_PERSON_ID (temporaire)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  get-id:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dépendances
        run: pip install -r requirements.txt

      - name: Récupérer le sub
        env:
          LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_TOKEN }}
        run: |
          echo "PERSON_ID_START"
          python scripts/get_person_id.py
          echo "PERSON_ID_END"
